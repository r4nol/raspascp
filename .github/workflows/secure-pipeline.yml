name: Secure Supply Chain

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  security-gates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ascp-app
      IMAGE_TAG: ${{ github.sha }}
      LOCAL_IMAGE: ascp-app:${{ github.sha }}
      REGISTRY_IMAGE: ghcr.io/${{ github.repository }}/ascp-app:${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Gitleaks scan
        run: |
          echo "[gitleaks] Running scan"
          mkdir -p artifacts
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks:latest detect \
            --source=/repo \
            --config=/repo/.gitleaks.toml \
            --no-banner \
            --report-format json \
            --report-path /repo/artifacts/gitleaks.json \
            --exit-code=1

      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: artifacts/gitleaks.json

      - name: Build image
        run: |
          echo "[build] Building $LOCAL_IMAGE"
          docker build -t "$LOCAL_IMAGE" -t "$REGISTRY_IMAGE" .

      - name: Cache trivy DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: ${{ runner.os }}-trivy-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-trivy-

      - name: Trivy scan
        run: |
          echo "[trivy] Scanning $LOCAL_IMAGE (HIGH/CRITICAL)"
          mkdir -p artifacts
          set -euo pipefail
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/" \
            aquasec/trivy:latest image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            "$LOCAL_IMAGE" | tee artifacts/trivy.txt

      - name: Upload trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: artifacts/trivy.txt

      - name: Install cosign
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: sigstore/cosign-installer@v3

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push image
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        run: |
          echo "[push] Pushing $REGISTRY_IMAGE"
          docker push "$REGISTRY_IMAGE"

      - name: Cosign sign + verify
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          if [ -z "${{ secrets.COSIGN_PRIVATE_KEY }}" ] || [ -z "${{ secrets.COSIGN_PUBLIC_KEY }}" ] || [ -z "${{ secrets.COSIGN_PASSWORD }}" ]; then
            echo "Missing cosign secrets. Set COSIGN_PRIVATE_KEY, COSIGN_PUBLIC_KEY, COSIGN_PASSWORD."
            exit 1
          fi

          mkdir -p .cosign
          echo "${{ secrets.COSIGN_PRIVATE_KEY }}" > .cosign/cosign.key
          echo "${{ secrets.COSIGN_PUBLIC_KEY }}" > .cosign/cosign.pub
          chmod 600 .cosign/cosign.key

          IMAGE_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$REGISTRY_IMAGE")
          if [ -z "$IMAGE_DIGEST" ]; then
            echo "Unable to resolve image digest for $REGISTRY_IMAGE"
            exit 1
          fi

          echo "[cosign] Signing $IMAGE_DIGEST"
          cosign sign --yes --key .cosign/cosign.key --tlog-upload=false "$IMAGE_DIGEST"

          echo "[cosign] Verifying $IMAGE_DIGEST"
          cosign verify --key .cosign/cosign.pub --insecure-ignore-tlog=true "$IMAGE_DIGEST"
