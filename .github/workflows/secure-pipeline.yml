name: Secure Supply Chain

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  security-gates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    env:
      IMAGE_NAME: ascp-app
      IMAGE_TAG: ${{ github.sha }}
      LOCAL_IMAGE: ascp-app:${{ github.sha }}
      REGISTRY_IMAGE: ghcr.io/${{ github.repository }}/ascp-app:${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Gitleaks scan
        run: |
          echo "[gitleaks] Running scan"
          mkdir -p artifacts
          set +e
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks:latest detect \
            --source=/repo \
            --config=/repo/.gitleaks.toml \
            --no-banner \
            --report-format sarif \
            --report-path /repo/artifacts/gitleaks.sarif \
            --exit-code=1
          exit_code=$?
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks:latest detect \
            --source=/repo \
            --config=/repo/.gitleaks.toml \
            --no-banner \
            --report-format json \
            --report-path /repo/artifacts/gitleaks.json \
            --exit-code=1
          exit_code_json=$?
          set -e
          if [ "$exit_code" -ne 0 ] || [ "$exit_code_json" -ne 0 ]; then
            exit 1
          fi

      - name: Upload gitleaks SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: artifacts/gitleaks.sarif
          category: gitleaks

      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: artifacts/gitleaks.json

      - name: Build image
        run: |
          echo "[build] Building $LOCAL_IMAGE"
          docker build -t "$LOCAL_IMAGE" -t "$REGISTRY_IMAGE" .

      - name: Cache trivy DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: ${{ runner.os }}-trivy-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-trivy-

      - name: Trivy scan
        run: |
          echo "[trivy] Scanning $LOCAL_IMAGE (HIGH/CRITICAL)"
          mkdir -p artifacts
          set +e
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/" \
            aquasec/trivy:latest image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --format sarif \
            --output /repo/artifacts/trivy.sarif \
            "$LOCAL_IMAGE"
          exit_code=$?
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/" \
            aquasec/trivy:latest image \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            --format table \
            --output /repo/artifacts/trivy.txt \
            "$LOCAL_IMAGE"
          set -e
          if [ "$exit_code" -ne 0 ]; then
            exit 1
          fi

      - name: Upload trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: artifacts/trivy.txt

      - name: Upload trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: artifacts/trivy.sarif
          category: trivy

      - name: Security reports summary
        if: always()
        env:
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          summary_path = os.environ["GITHUB_STEP_SUMMARY"]

          def write(line=""):
              with open(summary_path, "a", encoding="utf-8") as handle:
                  handle.write(line + "\n")

          write("## Security Reports")

          # --- Gitleaks ---
          gitleaks_path = Path("artifacts/gitleaks.json")
          write("### Gitleaks")
          if gitleaks_path.exists():
              with gitleaks_path.open("r", encoding="utf-8") as handle:
                  data = json.load(handle)
              if isinstance(data, dict) and "leaks" in data:
                  findings = data.get("leaks") or []
              elif isinstance(data, list):
                  findings = data
              else:
                  findings = []

              total = len(findings)
              write(f"- Total findings: **{total}**")
              if total:
                  counts = {}
                  examples = {}
                  for finding in findings:
                      rule_id = finding.get("RuleID", "unknown")
                      counts[rule_id] = counts.get(rule_id, 0) + 1
                      if rule_id not in examples:
                          file_path = finding.get("File", "")
                          line = finding.get("StartLine", "")
                          examples[rule_id] = f"{file_path}:{line}" if file_path else ""

                  top = sorted(counts.items(), key=lambda item: item[1], reverse=True)[:10]
                  write("")
                  write("<details><summary>Top rules</summary>")
                  write("")
                  write("| Rule | Count | Example |")
                  write("| --- | ---: | --- |")
                  for rule_id, count in top:
                      write(f"| `{rule_id}` | {count} | {examples.get(rule_id, '')} |")
                  write("</details>")
          else:
              write("- Report not found.")

          # --- Trivy ---
          trivy_sarif_path = Path("artifacts/trivy.sarif")
          write("")
          write("### Trivy")
          if trivy_sarif_path.exists():
              with trivy_sarif_path.open("r", encoding="utf-8") as handle:
                  sarif = json.load(handle)
              results = []
              for run in sarif.get("runs", []):
                  results.extend(run.get("results", []) or [])
              total = len(results)
              write(f"- Total vulnerabilities: **{total}**")

              if total:
                  severity_counts = {}
                  for result in results:
                      props = result.get("properties") or {}
                      severity = props.get("severity") or props.get("Severity") or result.get("level") or "unknown"
                      severity = str(severity).lower()
                      severity_counts[severity] = severity_counts.get(severity, 0) + 1

                  if severity_counts:
                      write("")
                      write("| Severity | Count |")
                      write("| --- | ---: |")
                      for sev, count in sorted(severity_counts.items(), key=lambda item: item[0]):
                          write(f"| `{sev}` | {count} |")
          else:
              write("- SARIF report not found.")

          trivy_table_path = Path("artifacts/trivy.txt")
          if trivy_table_path.exists():
              content = trivy_table_path.read_text(encoding="utf-8", errors="ignore").strip().splitlines()
              preview = "\n".join(content[:200])
              write("")
              write("<details><summary>Trivy table (first 200 lines)</summary>")
              write("")
              write("```")
              write(preview)
              write("```")
              write("</details>")

          write("")
          run_url = os.environ.get("RUN_URL")
          if run_url:
              write(f"Full run: {run_url}")
          PY

      - name: Install cosign
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: sigstore/cosign-installer@v3

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push image
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        run: |
          echo "[push] Pushing $REGISTRY_IMAGE"
          docker push "$REGISTRY_IMAGE"

      - name: Cosign sign + verify
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          if [ -z "${{ secrets.COSIGN_PRIVATE_KEY }}" ] || [ -z "${{ secrets.COSIGN_PUBLIC_KEY }}" ] || [ -z "${{ secrets.COSIGN_PASSWORD }}" ]; then
            echo "Missing cosign secrets. Set COSIGN_PRIVATE_KEY, COSIGN_PUBLIC_KEY, COSIGN_PASSWORD."
            exit 1
          fi

          mkdir -p .cosign
          echo "${{ secrets.COSIGN_PRIVATE_KEY }}" > .cosign/cosign.key
          echo "${{ secrets.COSIGN_PUBLIC_KEY }}" > .cosign/cosign.pub
          chmod 600 .cosign/cosign.key

          IMAGE_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$REGISTRY_IMAGE")
          if [ -z "$IMAGE_DIGEST" ]; then
            echo "Unable to resolve image digest for $REGISTRY_IMAGE"
            exit 1
          fi

          echo "[cosign] Signing $IMAGE_DIGEST"
          cosign sign --yes --key .cosign/cosign.key --tlog-upload=false "$IMAGE_DIGEST"

          echo "[cosign] Verifying $IMAGE_DIGEST"
          cosign verify --key .cosign/cosign.pub --insecure-ignore-tlog=true "$IMAGE_DIGEST"
