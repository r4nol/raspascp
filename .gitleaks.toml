title = "ASCP Gitleaks Configuration"

# Keep the default rule set and add ASCP-specific rules below.
[extend]
useDefault = true

[[rules]]
id = "iban"
description = "Potential IBAN (international bank account number)"
regex = '''(?i)\b[A-Z]{2}\d{2}(?:\s?[A-Z0-9]){11,30}\b'''
tags = ["iban", "financial"]

[[rules]]
id = "swift-bic"
description = "Potential SWIFT/BIC code"
regex = '''\b(?i:swift|bic)[^A-Z0-9]{0,10}[A-Z]{4}[A-Z]{2}[A-Z0-9]{2}(?:[A-Z0-9]{3})?\b'''
tags = ["swift", "bic", "financial"]

[[allowlists]]
description = "Known non-production test data and examples"
paths = [
  '''^tests?/''',
  '''^testdata/''',
  '''\.example$''',
  '''^artifacts/''',
  '''^\.cosign/'''
]
regexes = [
  '''DE89\s?3704\s?0044\s?0532\s?0130\s?00''',
  '''UA111111111111111111111111111''',
  '''UA222222222222222222222222222'''
]
