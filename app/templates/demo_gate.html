<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ASCP Demo Access</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    :root {
      --ascp-ink: #0f1d2e;
      --ascp-muted: #5b6b7c;
      --ascp-accent: #1a73e8;
      --ascp-bg: #f6f8fb;
      --ascp-card: #ffffff;
      --ascp-border: #e3e8ef;
    }

    body {
      font-family: "Inter", system-ui, -apple-system, Segoe UI, sans-serif;
      background: radial-gradient(900px 500px at 50% -10%, rgba(26, 115, 232, 0.12), transparent 60%),
                  var(--ascp-bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ascp-ink);
      padding: 24px;
    }

    .access-card {
      background: var(--ascp-card);
      border: 1px solid var(--ascp-border);
      border-radius: 20px;
      padding: 36px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 24px 60px rgba(15, 29, 46, 0.08);
    }

    .btn-primary {
      background: var(--ascp-accent);
      border-color: var(--ascp-accent);
      border-radius: 12px;
      padding: 10px 20px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="access-card">
    <h1 class="h4 mb-2">Demo Access</h1>
    <p class="text-muted mb-4">Enter the access code to open the ASCP demo control plane.</p>

    {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <form method="post" action="/demo/access">
      <div class="mb-3">
        <label for="access_code" class="form-label">Access code</label>
        <input type="password" class="form-control" id="access_code" name="access_code" required />
      </div>
      <button type="submit" class="btn btn-primary w-100">Unlock Demo</button>
    </form>
  </div>
</body>
</html>
